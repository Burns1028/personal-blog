limit_req_zone $binary_remote_addr zone=burns_publish:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name burnsgao.me www.burnsgao.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://burnsgao.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name burnsgao.me www.burnsgao.me;

    ssl_certificate /etc/letsencrypt/live/burnsgao.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burnsgao.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.burnsgao.me) {
        return 308 https://burnsgao.me$request_uri;
    }

    client_max_body_size 32m;

    location ^~ /media/articles/ {
        alias /var/lib/burns-blog/media/articles/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /api/publish/ {
        limit_req zone=burns_publish burst=5 nodelay;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
